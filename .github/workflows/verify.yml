# NativeGameLink for Steam v3.0.0 - CI Verification Workflow
name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      # Current high-severity findings are transitive Millennium build/runtime
      # dependencies with no safe upstream update. Keep a hard gate for new
      # critical findings while `npm audit` remains part of release review.
      - run: npm audit --omit=dev --audit-level=critical
